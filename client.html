<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat</title>
    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            background-color: #1074d7;
            padding: 20px;
            margin: 0;
            height: 100vh;
        }

        #container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            height: 80vh;
            align-items: flex-start;
        }

        #chat-box, #users-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: rgb(249, 249, 249);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%; 
        }

        #chat-box {
            flex: 3; 
            margin-top: 40px;
            margin-bottom: 20px;
        }

        #users-box {
            flex: 1; 
        }

        .message {
            margin-bottom: 10px;
            padding: 7px 12px;
            border-radius: 5px;
            background-color: #e9ecef;
        }

        .ta-message {
            color: #dc3545;
            font-weight: bold;
            background-color: #ffebee;
        }

        .status-message {
            color: #007bff;
            font-style: italic;
            background-color: #e7f1ff;
        }

        #message-input {
            width: 75%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            margin-left: 630px;
        }

        #send-button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        #send-button:hover {
            background-color: #218838;
        }

        #send-button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-primary:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        h1, h3 {
            color: #333;
            text-align: center;
        }

        #users-header {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 10px;
            color: #007bff;
            flex-shrink: 0;
        }

        #button-container {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            #container {
                flex-direction: column;
            }
            #chat-box, #users-box {
                width: 100%;
                height: 40vh;
            }
            #button-container {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h1>WebSocket Chat</h1>

    <div class="mb-3">

        <div class="form-group">

            <label for="username" class="form-label">نام کاربری:</label>
            <input type="text" id="username" class="form-control" placeholder="نام خود را وارد کنید">

        </div>

        <div class="form-group">

            <label for="password" class="form-label">رمز عبور (برای TA):</label>
            <input type="password" id="password" class="form-control" placeholder="فقط برای TA">

        </div>

        <div id="button-container">

            <button onclick="connect()" id="connect-button" class="btn btn-primary">Connect</button>
            <button onclick="logout()" class="btn btn-danger mt-2" style="display: none;" id="logout-button">Exit</button>

        </div>

    </div>

    <hr id="seperator">

    <div id="container">

        <div>

            <h3>Messages</h3>

            <div id="chat-box" class="border"></div>

            <div class="mt-2">

                <input type="text" id="message-input" class="form-control d-inline-block" placeholder="پیام خود را بنویسید">
                <button id="send-button" onclick="sendMessage()" class="btn btn-success" disabled>ارسال</button>

            </div>

        </div>

        <div>

            <h3>Online Users</h3>

            <div id="users-header"></div>
            <div id="users-box" class="border"></div>

        </div>

    </div>

    <script>

        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectDelay = 5000; 
        let messages = []; 
        let users = []; 
        let isLoggedOut = false; 

        
        let username = sessionStorage.getItem('chat_username');
        let password = sessionStorage.getItem('chat_password');

        
        if (username) {
            document.getElementById('username').value = username;
            document.getElementById('username').disabled = true;
            document.getElementById('password').value = password || '';
            document.getElementById('password').disabled = true;
            document.getElementById('logout-button').style.display = 'inline-block';
            document.getElementById('connect-button').disabled = true;
            connect(); 
        }

        function resetState() {
            ws = null;
            reconnectAttempts = 0;
            messages = [];
            users = [];
            isLoggedOut = false;
            document.getElementById('send-button').disabled = true;
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('users-box').innerHTML = '';
            document.getElementById('users-header').textContent = '';
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('WebSocket قبلاً متصل است');
                return;
            }

            username = document.getElementById('username').value.trim();
            password = document.getElementById('password').value;

            if (!username) {
                alert('لطفاً نام کاربری را وارد کنید');
                return;
            }

            sessionStorage.setItem('chat_username', username);
            sessionStorage.setItem('chat_password', password);

            document.getElementById('username').disabled = true;
            document.getElementById('password').disabled = true;
            document.getElementById('logout-button').style.display = 'inline-block';
            document.getElementById('connect-button').disabled = true;
            document.getElementById('send-button').disabled = false;

            console.log('اتصال به WebSocket: ws://localhost:8765');
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = function() {
                console.log('اتصال WebSocket برقرار شد');
                reconnectAttempts = 0;
                const loginMessage = { type: "login", username: username, password: password };
                console.log('ارسال پیام ورود:', loginMessage);
                ws.send(JSON.stringify(loginMessage));
                addMessage('اتصال برقرار شد!', false, true);
                restoreMessages();
                updateUsersHeaderAndList(users, false); 
            };

            ws.onmessage = function(event) {
                console.log('پیام دریافتی:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    if (data.error) {
                        alert(data.error);
                        logout(); 
                        return;
                    }
                    if (data.message) {
                        messages.push({ text: data.message, isTa: data.ta_connected && data.message.startsWith('[TA]') });
                        addMessage(data.message, data.ta_connected && data.message.startsWith('[TA]'));
                    }
                    if (data.users) {
                        users = data.users;
                        updateUsersHeaderAndList(users, data.ta_connected);
                    }
                    if (data.type === "ping") {
                        console.log('پینگ دریافت شد، ارسال پانگ');
                        ws.send(JSON.stringify({ type: "pong" }));
                    }
                } catch (e) {
                    console.error('خطا در پردازش پیام:', e);
                    addMessage('خطا در پردازش پیام سرور', false, true);
                }
            };

            ws.onerror = function(error) {
                console.error('خطای WebSocket:', error);
                addMessage('خطا در اتصال WebSocket، در تلاش برای اتصال مجدد...', false, true);
            };

            ws.onclose = function() {
                console.log('اتصال WebSocket قطع شد');
                addMessage('اتصال قطع شد.', false, true);
                document.getElementById('send-button').disabled = true;
                ws = null; 
            };
        }

        function logout() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            sessionStorage.removeItem('chat_username');
            sessionStorage.removeItem('chat_password');
            username = null;
            password = null;
            resetState(); 
            document.getElementById('username').value = '';
            document.getElementById('username').disabled = false;
            document.getElementById('password').value = '';
            document.getElementById('password').disabled = false;
            document.getElementById('logout-button').style.display = 'none';
            document.getElementById('connect-button').disabled = false; 
            addMessage('شما از سیستم خارج شدید.', false, true);
        }

        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                const messageData = { type: "message", message: message };
                console.log('ارسال پیام:', messageData);
                ws.send(JSON.stringify(messageData));
                messageInput.value = '';
                ws.send(JSON.stringify({ type: "request_users" }));
            } else {
                console.warn('نمی‌توان پیام ارسال کرد: WebSocket وصل نیست یا پیام خالی است');
                addMessage('نمی‌توان پیام ارسال کرد، در حال اتصال مجدد...', false, true);
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connect();
                }
            }
        }

        function addMessage(message, isTa = false, isStatus = false) {
            const chatBox = document.getElementById('chat-box');
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            if (isTa) {
                messageElement.classList.add('ta-message');
            } else if (isStatus) {
                messageElement.classList.add('status-message');
            }
            messageElement.textContent = message;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function restoreMessages() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');
                if (msg.isTa) {
                    messageElement.classList.add('ta-message');
                }
                messageElement.textContent = msg.text;
                chatBox.appendChild(messageElement);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateUsersHeaderAndList(users, taConnected) {
            console.log('به‌روزرسانی لیست کاربران:', users);
            const usersHeader = document.getElementById('users-header');
            const usersBox = document.getElementById('users-box');
            usersHeader.textContent = `تعداد کاربران آنلاین: ${users.length}`;
            usersBox.innerHTML = '';
            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.textContent = user;
                if (user.startsWith('TA')) {
                    userElement.style.color = 'red';
                    userElement.style.fontWeight = 'bold';
                }
                usersBox.appendChild(userElement);
            });
        }

        
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "request_users" }));
            }
        }, 5000);

        
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        
        window.addEventListener('focus', () => {
            console.log('تب فعال شد');
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.log('تلاش برای اتصال مجدد به دلیل فوکوس تب');
                if (!isLoggedOut) {
                    connect(); 
                }
            } else {
                ws.send(JSON.stringify({ type: "request_users" }));
            }
        });
    </script>
</body>
</html>
